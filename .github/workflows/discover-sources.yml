name: Build candidate source catalog

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Distinct candidate sources to collect"
        required: true
        default: "2000"
        type: string
  push:
    branches: [main]
    paths:
      - "config/discovery_queries.json"
      - "tools/discover_sources.py"
      - ".github/workflows/discover-sources.yml"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Collect public-repository metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target || '2000' }}
        run: python tools/discover_sources.py --target "$TARGET"
      - name: Commit resumable catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/candidates.jsonl
          git diff --cached --quiet || git commit -m "Build source candidate catalog"
          git push
